# Inclua este bloco no servidor HTTPS de pedromerli.com.
# O container Nginx deve pertencer à rede Docker "portfolio-proxy".

location = /observatorio-municipios {
    return 301 /observatorio-municipios/;
}

location ^~ /observatorio-municipios/ {
    proxy_pass http://observatorio-municipios:8501;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit mantém uma conexão WebSocket com o navegador.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;
}
