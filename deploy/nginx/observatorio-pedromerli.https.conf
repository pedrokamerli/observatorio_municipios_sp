server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name observatorio.pedromerli.com;

    ssl_certificate /etc/letsencrypt/live/observatorio.pedromerli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/observatorio.pedromerli.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/observatorio.pedromerli.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        return 301 /observatorio-municipios/;
    }

    location = /observatorio-municipios {
        return 301 /observatorio-municipios/;
    }

    location ^~ /observatorio-municipios/ {
        proxy_pass http://observatorio-municipios:8501;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
